name: Scale Agent — Windows Installer

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: node scripts/create-placeholder-ico.js

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --run

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: FLUXAR-Scale-Agent-Setup-0.1.14-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
